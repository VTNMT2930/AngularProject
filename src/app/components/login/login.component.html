<div class="container" [class.right-panel-active]="isSignUpActive" id="container" style="margin-top: 50px; margin-bottom:50px">
	<div class="form-container sign-up-container">
		<form (ngSubmit)="onSignUp()" #signUpForm="ngForm">
			<h1>Create Account</h1>
			<div class="social-container">
				<a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
				<a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
				<a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
			</div>
			<span>or use your email for registration</span>
			<input type="text" placeholder="Name" [(ngModel)]="signUpUser.username" name="username" required />
			<input type="email" placeholder="Email" [(ngModel)]="signUpUser.email" name="email" required email />
			<input type="password" placeholder="Password" [(ngModel)]="signUpUser.password" name="password" required
				minlength="6" />
			<button  type="submit" (click)="onSignUp()" style="margin-bottom: 10px;">Sign Up</button>
		</form>
	</div>
	<div class="form-container sign-in-container">
		<form (ngSubmit)="onSignIn()" #signInForm="ngForm">
			<h1>Sign in</h1>
			<div class="social-container">
				<a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
				<a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
				<a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
			</div>
			<span>or use your account</span>
			<input type="text" placeholder="Username" [(ngModel)]="signInUser.username" name="username" required />
			<input type="password" placeholder="Password" [(ngModel)]="signInUser.password" name="password" required />
			<a href="#">Forgot your password?</a>
			<button type="submit" (click)="onSignIn()" style="margin-bottom: 10px;">Sign In</button>
		</form>
	</div>
	<div class="overlay-container">
		<div class="overlay">
			<div class="overlay-panel overlay-left">
				<h1>Welcome Back!</h1>
				<p>To keep connected with us please login with your personal info</p>
				<button class="ghost" id="signIn" (click)="togglePanel(false)">Sign In</button>
			</div>
			<div class="overlay-panel overlay-right">
				<h1>Hello, Friend!</h1>
				<p>Enter your personal details and start journey with us</p>
				<button class="ghost" id="signUp" (click)="togglePanel(true)">Sign Up</button>
			</div>
		</div>
	</div>
</div>
